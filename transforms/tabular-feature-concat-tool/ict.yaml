author:
- Hamdah Shafqat
contact: hamdahshafqat.abbasi@nih.gov
container: polusai/tabular-feature-concat-tool:0.1.0-dev0
description: Concatenate Nyxus channel features from multiple files, rename channels,
  and associate metadata.
entrypoint: python3 -m polus.tabular.transforms.feature_concat
inputs:
- description: Input data collection to be processed by this plugin
  format:
  - genericData
  name: inpDir
  required: true
  type: path
- description: Pattern to parse input files
  format:
  - string
  name: filePattern
  required: true
  type: string
- description: Group files based on variable
  format:
  - string
  name: groupBy
  required: true
  type: string
- description: Variable for channel name
  format:
  - string
  name: channelName
  required: true
  type: string
- description: List of selected features
  format:
  - string
  name: features
  required: false
  type: string
- description: Path to metadata file
  format:
  - genericData
  name: metaDir
  required: false
  type: path
- description: Generate an output preview.
  format:
  - boolean
  name: preview
  required: false
  type: boolean
name: polusai/TabularFeatureConcat
outputs:
- description: Output data collection
  format:
  - genericData
  name: outDir
  required: true
  type: path
repository: https://github.com/PolusAI/tabular-tools
specVersion: 1.0.0
title: Tabular Feature Concat
ui:
- description: Input data collection to be processed by this plugin
  key: inputs.inpDir
  title: inpDir
  type: path
- description: Pattern to parse input files
  key: inputs.filePattern
  title: filePattern
  type: text
- description: Group files based on variable
  key: inputs.groupBy
  title: groupBy
  type: text
- description: Variable for channel name
  key: inputs.channelName
  title: channelName
  type: text
- description: List of selected features
  key: inputs.features
  title: features
  type: text
- description: Path to metadata file
  key: inputs.metaDir
  title: metaDir
  type: path
version: 0.1.0-dev0
